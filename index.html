<!doctype html>
<html lang="en" data-light="golden">
<head>

  <title>MySkate</title>
  <meta name="description" content="A figure skating practice tracker: plan a session, log it at the rink, and watch your progress build. Your data stays on your device.">
  <meta name="theme-color" content="#0e2347">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MySkate">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">

</head>

    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 3.5 20.5 11V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/></symbol>

<div class="rink-bg" aria-hidden="true"></div>

<div class="shell">
  <nav class="nav-wrap" id="nav" aria-label="Main">
    <div class="tabbar">

      <a class="tab" href="#/ice" data-route="ice"><svg class="ic" aria-hidden="true"><use href="#i-ice"/></svg><span>Ice times</span></a>
      <a class="tab" href="#/plan" data-route="plan"><svg class="ic" aria-hidden="true"><use href="#i-plan"/></svg><span>Plan</span></a>
      <a class="tab" href="#/skate" data-route="skate"><svg class="ic" aria-hidden="true"><use href="#i-skate"/></svg><span>Skate</span></a>

<script type="module" src="js/app.js"></script>
