<!doctype html>
<html lang="en" data-light="golden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MySkate</title>
  <meta name="description" content="A figure skating practice tracker: plan a session, log it at the rink, and watch your progress build. Your data stays on your device.">
  <meta name="theme-color" content="#061641">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MySkate">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bodoni-moda-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <symbol id="i-plan" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></symbol>

    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5v14M15.5 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>

  <svg class="rink-bg__sparkles" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <g>
      <g transform="translate(230 330) scale(1.1)"><path class="sp" style="--d:.2s" d="M0-9 2.4-2.4 9 0 2.4 2.4 0 9-2.4 2.4-9 0-2.4-2.4z"/></g>

      <g transform="translate(700 566) scale(.9)"><path class="sp" style="--d:3.1s" d="M0-9 2.4-2.4 9 0 2.4 2.4 0 9-2.4 2.4-9 0-2.4-2.4z"/></g>

      <g transform="translate(1162 790) scale(1.1)"><path class="sp" style="--d:1.7s" d="M0-9 2.4-2.4 9 0 2.4 2.4 0 9-2.4 2.4-9 0-2.4-2.4z"/></g>
      <g transform="translate(520 205) scale(.8)"><path class="sp" style="--d:1.4s" d="M0-9 2.4-2.4 9 0 2.4 2.4 0 9-2.4 2.4-9 0-2.4-2.4z"/></g>

</div>

<div class="shell">
  <nav class="nav-wrap" id="nav" aria-label="Main">
    <div class="tabbar">
      <span class="lens"></span>
      <a class="tab" href="#/home" data-route="home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg>Home</a>
      <a class="tab" href="#/ice" data-route="ice"><svg class="ic" aria-hidden="true"><use href="#i-ice"/></svg>Ice</a>
      <a class="tab" href="#/plan" data-route="plan"><svg class="ic" aria-hidden="true"><use href="#i-plan"/></svg>Plan</a>
      <a class="tab" href="#/skate" data-route="skate"><svg class="ic" aria-hidden="true"><use href="#i-skate"/></svg>Skate</a>
      <a class="tab" href="#/progress" data-route="progress"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg>Progress</a>
      <a class="tab" href="#/me" data-route="me"><svg class="ic" aria-hidden="true"><use href="#i-me"/></svg>Me</a>
    </div>
  </nav>
  <main class="screen" id="screen" tabindex="-1">
    <noscript><section class="card"><h2>MySkate needs JavaScript</h2><p class="dim">Turn JavaScript on in your browser to use MySkate.</p></section></noscript>
  </main>
</div>

<script type="module" src="js/app.js"></script>

</html>
