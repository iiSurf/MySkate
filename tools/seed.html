<!doctype html>
<meta charset="utf-8">
<title>seed</title>
<!-- A tool for looking at the app with believable, made-up data. Open tools/seed.html?s=full&r=home through the local server and it
     fills this browser's storage, then jumps to that screen. It replaces whatever MySkate data is saved at this address.
     s = full | week0 | week2 | empty | active; r = home | ice | plan | skate | progress | me; n= (no name); plan=1; contrast=1; ob=1 (first run).
     Not part of the app. -->
<script type="module">
  import { defaultState } from "../js/store.js";

  const q = new URLSearchParams(location.search);
  const scene = q.get("s") || "full";
  const route = q.get("r") || "home";
  const now = new Date();
  const iso = (offset) => { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - offset); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const monday = (now.getDay() + 6) % 7; // days since Monday

  const st = defaultState(now);
  st.profile.name = q.get("n") === "" ? "" : (q.get("n") || "Sam");
  st.profile.onboarded = true;
  st.profile.tourSeen = true;

  const ids = ["pre-free-skate.fi-open-mohawk", "pre-free-skate.bkwd-xovers-bo-glide", "pre-free-skate.bo-to-fo-transition", "pre-free-skate.xover-mohawk-sequence", "pre-free-skate.mazurka", "pre-free-skate.bkwd-inside-pivots", "pre-free-skate.one-foot-upright-spin", "pre-free-skate.waltz-jump"];
  const make = (offset, i) => {
    const date = iso(offset);
    const picks = [ids[i % 8], ids[(i + 2) % 8], ids[(i + 5) % 8]];
    return { id: "s" + i, date, startedAt: date + "T17:00:00.000Z", bookedMin: 60, onIceSec: 2400 + ((i * 137) % 1500),
      entries: picks.map((id, j) => ({ skillId: id, stars: Math.min(5, 2 + ((i + j) % 4) + (i > 6 ? 1 : 0)), landed: id.includes("jump") ? 4 + (i % 3) : 0, attempts: id.includes("jump") ? 7 + (i % 3) : 0, note: "" })),
      note: i === 0 ? "Mohawks felt smoother today." : "", cost: i % 3 === 0 ? 18 : null };
  };

  /* Six whole weeks behind (two sessions each), then this week as the scene says. */
  const past = [];
  for (let w = 1; w <= 6; w++) { past.push(monday + 7 * (w - 1) + 1 + 0, monday + 7 * (w - 1) + 3); }
  const thisWeek = { week0: [], full: [monday > 3 ? 3 : 0], week2: [Math.min(monday, 5), Math.min(monday, 1)] }[scene] || [];
  const offsets = scene === "empty" ? [] : [...thisWeek.filter((o) => o <= monday), ...past];
  st.sessions = offsets.map((o, i) => make(o, i));

  if (scene === "full" || scene === "week0" || scene === "week2") {
    st.goals = [{ id: "g1", skillId: ids[7], target: 4, date: iso(-28), created: iso(10) }];
    st.homework = [{ id: "h1", text: "Mohawk turns, ten each way", skillId: ids[3], due: iso(-3), done: false, doneOn: "", created: iso(5) }];
    st.offIce = [{ id: "o1", date: iso(2), kind: "strength", minutes: 25, note: "" }];
    st.rinks = [{ id: "r1", name: "Highland Ice Arena", city: "Shoreline", url: null, color: "#5fd8e6", updated: iso(3) }];
    st.iceSessions = [
      { id: "i1", rinkId: "r1", kind: "freestyle", days: [2, 4], date: null, start: "18:00", end: "19:00", price: 18, note: "", from: null, to: null, skip: [], every: 1, imported: false, pick: true },
      { id: "i2", rinkId: "r1", kind: "public", days: [6], date: null, start: "14:00", end: "15:30", price: 12, note: "", from: null, to: null, skip: [], every: 1, imported: false, pick: false },
    ];
  }
  if (q.get("compete") === "1") {
    const ev = { id: "e1", name: "Fall Classic", date: iso(-28), place: "Highland Ice Arena", note: "", result: null,
      day: [
        { id: "d1", label: "Arrive and check in", time: "07:30", mins: 30, mine: false },
        { id: "d2", label: "Warm-up, group 2", time: "09:10", mins: 15, mine: false },
        { id: "d3", label: "Zamboni", time: "09:25", mins: 15, mine: false },
        { id: "d4", label: "Moonlight", time: "09:48", mins: 4, mine: true },
        { id: "d5", label: "Awards", time: "11:30", mins: 20, mine: false },
      ],
      bring: [{ id: "b1", text: "Skates, sharpened", done: true }, { id: "b2", text: "Music on two devices", done: false }, { id: "b3", text: "Costume", done: false }] };
    const past = { id: "e0", name: "Spring Showcase", date: iso(150), place: "Lynnwood Ice Center", note: "", day: [], bring: [], result: { programId: "", placing: 2, of: 9, marks: {}, note: "", coach: "", recordedOn: iso(150) } };
    const els = [
      { id: "m1", label: "Opening pose", type: "pose", skillId: "", x: 0.1, y: 0.7, at: 0, dur: 6 },
      { id: "m2", label: "Mohawk sequence", type: "steps", skillId: ids[3], x: 0.27, y: 0.3, at: 10, dur: 16 },
      { id: "m3", label: "Waltz jump", type: "jump", skillId: ids[7], x: 0.44, y: 0.72, at: 28, dur: 8 },
      { id: "m4", label: "Mazurka", type: "move", skillId: ids[4], x: 0.6, y: 0.3, at: 44, dur: 14 },
      { id: "m5", label: "One-foot spin", type: "spin", skillId: ids[6], x: 0.78, y: 0.68, at: 62, dur: 14 },
      { id: "m6", label: "Closing pose", type: "pose", skillId: "", x: 0.9, y: 0.3, at: 80, dur: 10 },
    ];
    st.events = [past, ev];
    st.programs = [{ id: "p1", name: "Moonlight", music: { title: "Clair de Lune", artist: "Debussy" }, lengthSec: 90, kind: "free", eventId: "e1", note: "", elements: els, moments: [{ id: "n1", at: 30, text: "the music swells" }, { id: "n2", at: 65, text: "crescendo" }], created: iso(5) }];
  }
  if (scene === "active") {
    const a = { id: "a1", startedAt: Date.now() - 12 * 60 * 1000, bookedMin: 60, order: ids.slice(3, 6), index: 0, entries: {}, running: true, runStart: Date.now() - 12 * 60 * 1000, accumMs: 0 };
    a.entries[ids[3]] = { skillId: ids[3], stars: 2, landed: 0, attempts: 0, note: "" };
    st.active = a;
    st.plan = { slotMin: 60, skillIds: ids.slice(3, 6) };
  }
  if (q.get("plan") === "1") st.plan = { slotMin: 60, skillIds: ids.slice(3, 6) };
  if (q.get("contrast") === "1") st.settings.contrast = true;
  if (q.get("ob") === "1") { st.profile.onboarded = false; st.profile.tourSeen = false; }

  localStorage.setItem("myskate.v1", JSON.stringify(st));
  location.replace("../index.html#/" + route);
</script>
