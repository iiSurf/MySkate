<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MySkate skate lab</title>
  <style>
    body { margin: 0; padding: 24px; background: linear-gradient(180deg, #14468e, #061641); color: #eef9ff; font: 16px/1.5 system-ui, sans-serif; }
    .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: end; margin-bottom: 24px; }
    .light { background: #e8f3f9; padding: 16px; border-radius: 16px; }
    svg { display: block; }
    .ghost { filter: grayscale(1) brightness(0.62); opacity: 0.5; }
  </style>
</head>
<body>
  <p>Skate lab: the skate illustration at large, hero (with ice reflection), and small sizes.</p>
  <div class="row">
    <svg width="760" viewBox="0 0 290 300" role="img" aria-label="Figure skate with reflection on ice">
      <defs>
        <linearGradient id="fadeg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="197" width="290" height="110"><rect x="0" y="197" width="290" height="110" fill="url(#fadeg)"/></mask>
      </defs>
      <g mask="url(#fade)"><g transform="translate(0 394) scale(1 -1)"><use href="../assets/skate.svg#skate" width="290" height="210"/></g></g>
      <use href="../assets/skate.svg#skate" width="290" height="210"/>
    </svg>
  </div>
  <div class="row">
    <svg width="120" height="87"><use href="../assets/skate.svg#skate" width="120" height="87"/></svg>
    <svg width="56" height="41"><use href="../assets/skate.svg#skate" width="56" height="41"/></svg>
    <svg width="40" height="29"><use href="../assets/skate.svg#skate" width="40" height="29"/></svg>
    <svg width="26" height="19"><use href="../assets/skate.svg#skate" width="26" height="19"/></svg>
    <svg class="ghost" width="56" height="41"><use href="../assets/skate.svg#skate" width="56" height="41"/></svg>
    <div class="light"><svg width="160" height="116"><use href="../assets/skate.svg#skate" width="160" height="116"/></svg></div>
  </div>
</body>
</html>
